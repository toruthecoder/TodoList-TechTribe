<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Baloo+2:wght@400..800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Baloo+2:wght@400..800&family=Baloo+Bhaina+2:wght@400..800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Baloo+2:wght@400..800&family=Baloo+Bhaina+2:wght@400..800&family=Baloo+Tammudu+2:wght@400..800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class='w-screen flex items-center justify-center h-full overflow-x-hidden'>
    <video autoplay loop playsinline muted class="absolute inset-0 h-full w-full object-cover -z-100">
        <source src="assests/Chillhop.mp4" type="video/mp4" />
    </video>
    <div class="container text-white w-full">
        <div class='wrapper relative z-10 flex flex-col items-center'>
            <div class="head">
                <h1 class='mt-[58px] mb-[44px] font-[400] text-[46px] leading-[100%] tracking-[0] font-normal bg-[linear-gradient(20deg,_rgba(196, 86, 77, 1)_0%,_rgba(134, 75, 73, 1)_100%)] bg-clip-text  bg-white/30 backdrop-blur-lg rounded-xl shadow-xl border border-white/20 px-12 py-[12px] max-w-sm'
                    style="font-family: 'Baloo 2', sans-serif;">TODO-List</h1>
            </div>
            <div class="inputArea" style='display:flex;'>
                <input type="text" name='input'
                    class='input focus:outline-none font-[400] font-normal text-[24px] leading-[100%] tracking-0 bg-white/10 backdrop-blur-lg rounded-xl shadow-xl border border-white/20 px-[15px] w-[614px] h-[81px]'
                    placeholder='Enter ToDo'>
                <button
                    class='addBtn ml-[10px] font-[400] font-normal text-[24px] leading-[100$] tracking-0 bg-white/10 backdrop-blur-lg rounded-xl shadow-xl border border-white/20 px-[32px] py-'
                    style='cursor:pointer;' style="font-family: 'Baloo Bhaina 2', sans-serif;">add</button>
                <div>
                    <select name="" id="select" style="font-family: 'Baloo Bhaina 2', sans-serif;"
                        class='relative focus:outline-none appearance-none ml-[46px] w-[350px] h-[81px] font-[400] font-normal text-[24px] leading-[100$] tracking-0 bg-white/10 backdrop-blur-lg rounded-xl shadow-xl border border-white/20 pl-[25px]'><img
                            src="assests/Chevron Down.png" alt="chevron" class='absolute bg-clip'>
                        <option class='all bg-black text-white' value="all">All</option>
                        <option class='complete bg-black text-white' value="complete">
                            Completetd</option>
                        <option class='incomplete bg-black text-white' value="incomplete">Pending
                        </option>
                    </select>
                </div>
            </div>
            <div class="list">
                <ul class='mt-[74px] wrap-break-word h-[70vh] overflow-auto flex flex-col items-start'></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
