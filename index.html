<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Baloo+2:wght@400..800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Baloo+2:wght@400..800&family=Baloo+Bhaina+2:wght@400..800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Baloo+2:wght@400..800&family=Baloo+Bhaina+2:wght@400..800&family=Baloo+Tammudu+2:wght@400..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .btn-red:hover {
            color: red;
        }

        .strike {
            position: relative;
            display: inline-block;
        }

        .strike::after {
            content: "";
            position: absolute;
            left: 0;
            top: 35%;
            width: 93%;
            height: 2px;
            background: white;
            transform: translateY(-50%);
        }

        .list ul::-webkit-scrollbar {
            width: 5px;
        }

        .list ul::-webkit-scrollbar-track {
            box-shadow: inset 0 0 5px grey;
            border-radius: 20px;
        }

        /* Handle */
        .list ul::-webkit-scrollbar-thumb {
            background: white;
            border-radius: 10px;
        }

        /* Handle on hover */
        .list ul::-webkit-scrollbar-thumb:hover {
            background: black;
        }

        /* HTML: <div class="loader"></div> */
        .loader {
            --d: 22px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            color: #25b09b;
            box-shadow:
                calc(1*var(--d)) calc(0*var(--d)) 0 0,
                calc(0.707*var(--d)) calc(0.707*var(--d)) 0 1px,
                calc(0*var(--d)) calc(1*var(--d)) 0 2px,
                calc(-0.707*var(--d)) calc(0.707*var(--d)) 0 3px,
                calc(-1*var(--d)) calc(0*var(--d)) 0 4px,
                calc(-0.707*var(--d)) calc(-0.707*var(--d))0 5px,
                calc(0*var(--d)) calc(-1*var(--d)) 0 6px;
            animation: l27 1s infinite steps(8);
            position: relative;
            top: 50%;
            left: 49%;
            z-index: 100;
            display: none;
        }

        @keyframes l27 {
            100% {
                transform: rotate(1turn)
            }
        }

        .goo {
            width: 100%;
            height: 100%;
            z-index: 100;
            background-color: white;
            position: absolute;
            inset: 0;
            display: none;
        }

        .inputCheck {
            border: 1px solid #ccc;
        }

        .inputCheck:checked {
            background-color: rgb(54, 225, 54);
        }
    </style>
</head>

<body class='w-screen flex items-center justify-center h-full overflow-x-hidden'>
    <div class='noti absolute  w-full h-full z-100 hidden'>
        <div
            class='get hidden relative w-[300px] top-[50%] left-[40%] bg-[white] px-10 py-10 z-100 text-center flex flex-col rounded-[10px]'>
            <p>Are You Sure?</p>
            <div class='flex gap-2 mt-4 justify-center'>
                <button class='yesBtn bg-red-400 rounded-[5px] cursor-pointer px-5 text-white py-1'>Delete</button>
                <button class='noBtn bg-green-400 rounded-[5px] cursor-pointer px-5 text-white py-1'>Cancel</button>
            </div>
        </div>
    </div>

    <div class='goo'>
        <div class="loader"></div>
    </div>
    <video autoplay loop playsinline muted class="absolute inset-0 h-full w-full object-cover -z-100">
        <source src="assests/Chillhop.mp4" type="video/mp4" />
    </video>
    <div class="container text-white w-full">
        <div class='wrapper relative z-10 flex flex-col items-center'>
            <div class="head">
                <h1 class='mt-[58px] mb-[44px] font-[400] text-[36px] leading-[100%] tracking-[0] font-normal bg-[linear-gradient(20deg,_rgba(196, 86, 77, 1)_0%,_rgba(134, 75, 73, 1)_100%)] bg-clip-text  bg-white/30 backdrop-blur-lg rounded-xl shadow-xl border border-white/20 px-12 py-[6px] max-w-sm'
                    style="font-family: 'Baloo 2', sans-serif;">TODO-List</h1>
            </div>
            <div class="inputArea px-5 max-w-[1144px] w-full" style='display:flex;'>
                <input type="text" name='input'
                    class='input focus:outline-none font-[400] font-normal text-[20px] leading-[100%] tracking-0 bg-white/10 backdrop-blur-lg rounded-xl shadow-xl border border-white/20 px-[15px] w-[614px] h-[60px]'
                    placeholder='Enter ToDo'>
                <button
                    class='addBtn ml-[10px] font-[400] font-normal text-[18px] leading-[100$] tracking-0 bg-white/10 backdrop-blur-lg rounded-xl shadow-xl border border-white/20 px-[20px]'
                    style='cursor:pointer;' style="font-family: 'Baloo Bhaina 2', sans-serif;">Add</button>
                <div>
                    <select name="" id="select" style="font-family: 'Baloo Bhaina 2', sans-serif;"
                        class='relative focus:outline-none appearance-none ml-[46px] w-[350px] h-[60px] font-[400] font-normal text-[20px] leading-[100$] tracking-0 bg-white/10 backdrop-blur-lg rounded-xl shadow-xl border border-white/20 pl-[25px]'>
                        <option class='all bg-black text-white' value="all">All</option>
                        <option class='complete bg-black text-white' value="complete">
                            Completed</option>
                        <option class='incomplete bg-black text-white' value="incomplete">Pending
                        </option>
                    </select>
                </div>
            </div>
            <div class="list">
                <ul class='mt-[74px] wrap-break-word h-[63vh] overflow-auto flex flex-col items-start px-5'></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
